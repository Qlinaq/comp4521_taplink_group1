name: Android build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build, test and lint
        shell: bash
        run: |
          # One retry, only for a dependency-resolution failure. The first run of this
          # workflow failed with "could not resolve plugin artifact
          # com.google.devtools.ksp" while the same commit built on a re-run, i.e. the
          # Maven/plugin repositories were briefly unreachable from the runner. Such a
          # failure is not a defect in the code, so retry it once after dropping the
          # cached "not found" descriptors that would otherwise be reused verbatim.
          # A real compile, test or lint failure does not match the pattern and fails
          # the job immediately, keeping the signal honest.
          set -o pipefail
          build() {
            bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          }
          if build; then
            exit 0
          fi
          if grep -qiE "could not resolve|could not (GET|HEAD)|read timed out|connection reset|status code: 5[0-9][0-9]" "$RUNNER_TEMP/gradle.log"; then
            echo "::warning::Dependency resolution failed; retrying once (transient repository error)."
            rm -rf "$HOME/.gradle/caches/modules-2/metadata-"*/descriptors || true
            build
          else
            exit 1
          fi
      - name: Save APK and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: taplink-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14
