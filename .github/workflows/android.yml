name: Android build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install project SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Save APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taplink-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14
